<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rationalizing Denominators — A2 Playgrounds</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .tool-wrap { max-width: 860px; margin: 0 auto; padding: 16px 20px 48px; }
    .tool-bc { font-family:'Special Elite',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
    .tool-h1 { font-family:'Caveat',cursive; font-weight:700; font-size:2.4rem; line-height:1; margin:0 0 4px; }
    .tool-sub { font-size:14px; color:var(--ink-soft); margin-bottom:18px; }

    /* type selector */
    .type-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .type-tab {
      font-family:'Caveat',cursive; font-size:15px;
      padding:5px 18px; border:2px solid var(--ink-soft);
      border-radius:20px; cursor:pointer; background:var(--paper-2);
      color:var(--ink-soft); transition:all 0.12s;
    }
    .type-tab:hover { border-color:var(--ink); color:var(--ink); }
    .type-tab.active {
      background:var(--ink); color:var(--paper);
      border-color:var(--ink); box-shadow:2px 2px 0 rgba(29,26,20,0.25);
    }

    /* main card */
    .main-card {
      border:2px solid var(--ink);
      border-radius:6px 10px 8px 12px / 10px 7px 12px 8px;
      box-shadow:3px 4px 0 rgba(29,26,20,0.18);
      background:var(--paper);
      padding:20px 24px;
      margin-bottom:16px;
    }

    /* problem display */
    .prob-label {
      font-family:'Permanent Marker',cursive; font-size:11px;
      color:var(--ink-soft); letter-spacing:0.08em; margin-bottom:10px;
    }
    .prob-display {
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      margin-bottom:16px;
    }
    .prob-display .task-word {
      font-family:'Caveat',cursive; font-size:18px; color:var(--ink-soft);
    }
    .frac-box {
      display:inline-flex; flex-direction:column; align-items:center;
      font-family:'JetBrains Mono',monospace;
    }
    .frac-num { font-size:18px; padding:0 6px; }
    .frac-bar { height:2px; background:var(--ink); width:100%; min-width:30px; }
    .frac-den { font-size:18px; padding:0 6px; }

    /* step-by-step work */
    .steps-container { display:flex; flex-direction:column; gap:10px; }
    .work-step {
      border-left:4px solid var(--ghost);
      padding:10px 14px;
      background:var(--paper-2);
      border-radius:0 6px 6px 0;
      opacity:0.4;
      transition:opacity 0.3s;
    }
    .work-step.revealed {
      opacity:1;
      border-left-color:var(--accent);
    }
    .work-step.done {
      opacity:1;
      border-left-color:var(--green);
    }
    .work-step-num {
      font-family:'Permanent Marker',cursive; font-size:10px;
      color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:6px;
    }
    .work-step-title {
      font-family:'Caveat',cursive; font-weight:700; font-size:17px;
      color:var(--ink); margin-bottom:6px;
    }
    .work-step-math {
      font-family:'JetBrains Mono',monospace; font-size:13px;
      color:var(--ink-2); line-height:1.9; white-space:pre;
      background:rgba(29,26,20,0.04); border-radius:5px; padding:8px 12px;
      margin-bottom:4px;
    }
    .work-step-note {
      font-family: var(--f-body); font-size:12px;
      color:var(--ink-soft); font-style:italic; line-height:1.4;
    }

    /* answer box */
    .answer-box {
      background:var(--ink); color:var(--paper);
      border-radius:8px; padding:14px 18px;
      display:none; margin-top:10px;
      text-align:center;
    }
    .answer-box.show { display:block; }
    .answer-box .ans-label {
      font-family:'Permanent Marker',cursive; font-size:11px;
      letter-spacing:0.08em; opacity:0.6; margin-bottom:6px;
    }
    .answer-box .ans-val {
      font-family:'JetBrains Mono',monospace; font-size:20px;
    }
    .answer-box .ans-note {
      font-family: var(--f-body); font-size:13px;
      opacity:0.7; margin-top:4px;
    }

    /* controls */
    .ctrl-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .ctrl-btn {
      font-family:'Caveat',cursive; font-size:16px;
      padding:8px 18px; border:2px solid var(--ink); border-radius:6px;
      background:var(--paper); box-shadow:2px 2px 0 var(--ink);
      cursor:pointer; transition:all 0.1s; color:var(--ink);
    }
    .ctrl-btn:hover { background:var(--accent); color:white; transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }
    .ctrl-btn:active { transform:translate(1px,1px); box-shadow:1px 1px 0 var(--ink); }
    .ctrl-btn:disabled { opacity:0.3; cursor:not-allowed; }
    .ctrl-btn:disabled:hover { background:var(--paper); color:var(--ink); transform:none; box-shadow:2px 2px 0 var(--ink); }
    .ctrl-btn.show-all { border-color:var(--ghost); color:var(--ink-soft); box-shadow:2px 2px 0 var(--ghost); background:var(--paper-2); }

    /* why-this-works card */
    .why-card {
      border:2px dashed var(--ink-soft); border-radius:6px;
      padding:14px 16px; background:var(--paper);
    }
    .why-title { font-family:'Permanent Marker',cursive; font-size:11px; color:var(--ink-soft); letter-spacing:0.06em; margin-bottom:8px; }
    .why-body { font-family: var(--f-body); font-size:14px; color:var(--ink-2); line-height:1.6; }
    .why-body strong { color:var(--ink); }
    .why-body .hl { color:var(--accent); font-weight:bold; }
    .why-math { font-family:'JetBrains Mono',monospace; font-size:13px; background:rgba(29,26,20,0.06); border-radius:4px; padding:4px 8px; display:inline; }
  </style>
</head>
<body class="paper-lined">

    <a href="../index.html" class="nav-logo">A2 <span class="accent">Playgrounds</span></a>

  <div class="tool-wrap">
    <div class="tool-bc">← U3 · Rationals &amp; Imaginary · D5</div>
    <div class="tool-h1">Rationalizing Denominators</div>
    <div class="tool-sub">Conjugate method — step through multiplying to eliminate radicals and imaginary terms</div>

    <!-- type tabs -->
    <div class="type-tabs" id="type-tabs"></div>

    <!-- main work card -->
    <div class="main-card">
      <div class="prob-label" id="prob-label">SIMPLIFY</div>
      <div class="prob-display" id="prob-display"></div>
      <div class="steps-container" id="steps-container"></div>
      <div class="answer-box" id="answer-box">
        <div class="ans-label">SIMPLIFIED FORM</div>
        <div class="ans-val" id="ans-val">—</div>
        <div class="ans-note" id="ans-note">—</div>
      </div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="btn-next" onclick="revealNext()">Reveal Next Step →</button>
        <button class="ctrl-btn show-all" onclick="revealAll()">Show All Steps</button>
        <button class="ctrl-btn show-all" onclick="resetProblem()">↺ Reset</button>
      </div>
    </div>

    <!-- why this works -->
    <div class="why-card" id="why-card"></div>

  </div>

  <script>
  const PROBLEMS = [
    {
      id: 'sqrt-mono',
      tab: '1/√5',
      label: 'SIMPLIFY — monomial radical denominator',
      problemHTML: `<span class="task-word">Simplify</span>
<div class="frac-box">
  <div class="frac-num">1</div>
  <div class="frac-bar"></div>
  <div class="frac-den">√5</div>
</div>`,
      steps: [
        {
          title: "Identify the conjugate",
          math:
`The denominator is √5.

To rationalize, multiply by √5/√5
(which equals 1 — doesn't change the value).`,
          note: "For a single radical, just multiply by √n / √n."
        },
        {
          title: "Multiply numerator and denominator",
          math:
`   1     √5       1 · √5
——— · ——— = ———————
  √5    √5      √5 · √5`,
          note: "Top: 1 · √5 = √5   Bottom: √5 · √5 = 5"
        },
        {
          title: "Simplify",
          math:
`  1 · √5       √5
——————— = ———
  √5 · √5       5`,
          note: "√5 · √5 = (√5)² = 5. No more radical in the denominator!"
        }
      ],
      answer: "√5 / 5",
      answerNote: "Equivalent to (1/5)√5 ≈ 0.447",
      why: `<strong>Why do we rationalize?</strong> Traditionally, a radical in the denominator was considered "unsimplified." But the real reason is <strong>easier arithmetic</strong>: <span class="hl">1/√5 ≈ 0.4472…</span> is hard to verify by hand, but <span class="hl">√5/5</span> shows the structure clearly.`,
    },
    {
      id: 'sqrt-binom',
      tab: '4/(√3+1)',
      label: 'SIMPLIFY — binomial radical denominator',
      problemHTML: `<span class="task-word">Simplify</span>
<div class="frac-box">
  <div class="frac-num">4</div>
  <div class="frac-bar"></div>
  <div class="frac-den">√3 + 1</div>
</div>`,
      steps: [
        {
          title: "Find the conjugate",
          math:
`Denominator: (√3 + 1)

Conjugate:   (√3 − 1)

Key fact: (a+b)(a−b) = a² − b²
Here: (√3+1)(√3−1) = (√3)² − 1² = 3 − 1 = 2`,
          note: "The conjugate flips the sign in the middle. No more radicals!"
        },
        {
          title: "Multiply by conjugate/conjugate",
          math:
`    4        (√3 − 1)       4(√3 − 1)
————— · ————— = ——————————
(√3+1)   (√3 − 1)   (√3+1)(√3−1)`,
          note: "Multiplying by (√3−1)/(√3−1) = 1 keeps the value the same."
        },
        {
          title: "Expand the denominator",
          math:
`(√3 + 1)(√3 − 1) = (√3)² − (1)²
                 = 3 − 1
                 = 2`,
          note: "Difference of squares eliminates the radical!"
        },
        {
          title: "Expand the numerator",
          math:
`4(√3 − 1) = 4√3 − 4`,
          note: "Just distribute the 4."
        },
        {
          title: "Write the simplified form",
          math:
`    4(√3 − 1)      4√3 − 4
——————————— = ————————
(√3+1)(√3−1)        2

         = 2√3 − 2`,
          note: "Divide both terms in the numerator by 2."
        }
      ],
      answer: "2√3 − 2",
      answerNote: "≈ 2(1.732) − 2 ≈ 1.464. Check: 4/(√3+1) ≈ 4/2.732 ≈ 1.464 ✓",
      why: `<strong>Difference of squares is the key.</strong> Whenever the denominator is <span class="hl">(a + b)</span>, its conjugate <span class="hl">(a − b)</span> gives <span class="hl">(a+b)(a−b) = a² − b²</span>. If <em>a</em> is a radical, squaring it eliminates the radical. This works for both square roots and complex numbers.`,
    },
    {
      id: 'complex-mono',
      tab: '(3+i)/(2i)',
      label: 'SIMPLIFY — imaginary denominator',
      problemHTML: `<span class="task-word">Simplify</span>
<div class="frac-box">
  <div class="frac-num">3 + i</div>
  <div class="frac-bar"></div>
  <div class="frac-den">2i</div>
</div>`,
      steps: [
        {
          title: "Recall the key fact: i² = −1",
          math:
`To get rid of i in the denominator,
multiply by i/i.

Why? Because i · i = i² = −1 (a real number!)`,
          note: "Multiplying by i/i = 1, so the value doesn't change."
        },
        {
          title: "Multiply numerator and denominator by i",
          math:
`  (3 + i)     i        (3 + i) · i
———————— · ——— = ———————————
    2i        i           2i · i`,
          note: "Denominator: 2i · i = 2i² = 2(−1) = −2"
        },
        {
          title: "Expand the numerator",
          math:
`(3 + i) · i = 3i + i²
            = 3i + (−1)
            = −1 + 3i`,
          note: "Replace i² with −1."
        },
        {
          title: "Simplify the full fraction",
          math:
`  (3+i) · i      −1 + 3i       −1 + 3i
—————————— = ————————— = ————————
    2i · i          2(−1)            −2

Divide each term by −2:

   −1      3i        1      3i
  ———  + ——— = −(−———)  − ———
  −2      −2        2       2

= 1/2 − (3/2)i`,
          note: "Split the fraction into real and imaginary parts."
        }
      ],
      answer: "1/2 − (3/2)i",
      answerNote: "Standard form: a + bi with a = 1/2, b = −3/2",
      why: `<strong>Why multiply by i/i?</strong> We need the denominator to be a <em>real</em> number. Since <span class="hl">i² = −1</span>, multiplying i × i gives a real result. For pure imaginary denominators like 2i, this simple trick works. For <em>complex</em> denominators like (2+i), we need the complex conjugate instead.`,
    },
    {
      id: 'complex-binom',
      tab: '(5+2i)/(1+3i)',
      label: 'SIMPLIFY — complex denominator (conjugate method)',
      problemHTML: `<span class="task-word">Simplify</span>
<div class="frac-box">
  <div class="frac-num">5 + 2i</div>
  <div class="frac-bar"></div>
  <div class="frac-den">1 + 3i</div>
</div>`,
      steps: [
        {
          title: "Find the complex conjugate",
          math:
`Denominator: (1 + 3i)
Conjugate:   (1 − 3i)  ← flip the sign of i

Key fact: (a+bi)(a−bi) = a² + b²  (always real!)

Here: (1+3i)(1−3i) = 1² + 3² = 1 + 9 = 10`,
          note: "The complex conjugate of (a+bi) is (a−bi). The product is always real."
        },
        {
          title: "Multiply by conjugate/conjugate",
          math:
`  (5 + 2i)     (1 − 3i)      (5+2i)(1−3i)
——————— · ————— = ————————————
  (1 + 3i)   (1 − 3i)     (1+3i)(1−3i)`,
          note: "Multiplying by (1−3i)/(1−3i) = 1 keeps the value the same."
        },
        {
          title: "Expand the denominator",
          math:
`(1 + 3i)(1 − 3i) = 1² + 3²
                 = 1 + 9
                 = 10`,
          note: "Use the formula (a+bi)(a−bi) = a² + b². No i terms!"
        },
        {
          title: "Expand the numerator (FOIL)",
          math:
`(5 + 2i)(1 − 3i)
= 5(1) + 5(−3i) + 2i(1) + 2i(−3i)
= 5 − 15i + 2i − 6i²
= 5 − 13i − 6(−1)     ← i² = −1
= 5 − 13i + 6
= 11 − 13i`,
          note: "FOIL, then replace i² with −1, then combine like terms."
        },
        {
          title: "Write in standard form",
          math:
`  (5+2i)(1−3i)      11 − 13i
——————————— = ————————
  (1+3i)(1−3i)          10

  = 11/10 − (13/10)i`,
          note: "Standard form: a + bi where a = 11/10 and b = −13/10."
        }
      ],
      answer: "11/10 − (13/10)i",
      answerNote: "Or: 1.1 − 1.3i. Verify: (1.1−1.3i)(1+3i) = 1.1+3.3i−1.3i−3.9i² = 1.1+2i+3.9 = 5+2i ✓",
      why: `<strong>The conjugate trick for complex numbers.</strong> For any complex denominator <span class="hl">(a + bi)</span>, multiply by <span class="hl">(a − bi)/(a − bi)</span>. The product of a complex number and its conjugate is <span class="hl">a² + b²</span> — always a positive real number. This is the same principle as rationalizing square roots, just with i instead of √n.`,
    }
  ];

  // ── STATE ──
  let probIdx = 0;
  let revealedSteps = 0;

  function buildTabs() {
    const container = document.getElementById('type-tabs');
    container.innerHTML = '';
    PROBLEMS.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'type-tab' + (i === probIdx ? ' active' : '');
      btn.textContent = p.tab;
      btn.onclick = () => loadProblem(i);
      container.appendChild(btn);
    });
  }

  function loadProblem(idx) {
    probIdx = idx;
    revealedSteps = 0;
    const p = PROBLEMS[idx];

    // update tabs
    buildTabs();

    // label
    document.getElementById('prob-label').textContent = p.label;

    // problem display
    document.getElementById('prob-display').innerHTML = p.problemHTML;

    // steps
    const container = document.getElementById('steps-container');
    container.innerHTML = '';
    p.steps.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'work-step';
      div.id = `step-${i}`;
      div.innerHTML = `
        <div class="work-step-num">STEP ${i+1} OF ${p.steps.length}</div>
        <div class="work-step-title">${s.title}</div>
        <div class="work-step-math">${escHtml(s.math)}</div>
        ${s.note ? `<div class="work-step-note">${s.note}</div>` : ''}
      `;
      container.appendChild(div);
    });

    // answer
    const ansBox = document.getElementById('answer-box');
    ansBox.classList.remove('show');
    document.getElementById('ans-val').textContent = p.answer;
    document.getElementById('ans-note').textContent = p.answerNote;

    // why
    document.getElementById('why-card').innerHTML = `
      <div class="why-title">WHY THIS WORKS</div>
      <div class="why-body">${p.why}</div>
    `;

    // button
    document.getElementById('btn-next').disabled = false;
    document.getElementById('btn-next').textContent = 'Reveal Next Step →';
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function revealNext() {
    const p = PROBLEMS[probIdx];
    if (revealedSteps < p.steps.length) {
      // mark previous as done
      if (revealedSteps > 0) {
        document.getElementById(`step-${revealedSteps-1}`).className = 'work-step done';
      }
      document.getElementById(`step-${revealedSteps}`).className = 'work-step revealed';
      revealedSteps++;

      if (revealedSteps === p.steps.length) {
        document.getElementById('answer-box').classList.add('show');
        document.getElementById('btn-next').disabled = true;
        document.getElementById('btn-next').textContent = '✓ All steps revealed';
        // mark last as done too
        document.getElementById(`step-${revealedSteps-1}`).className = 'work-step done';
      } else {
        const remaining = p.steps.length - revealedSteps;
        document.getElementById('btn-next').textContent =
          remaining === 1 ? 'Final Step →' : `Reveal Next Step → (${remaining} left)`;
      }
    }
  }

  function revealAll() {
    const p = PROBLEMS[probIdx];
    while (revealedSteps < p.steps.length) {
      revealNext();
    }
  }

  function resetProblem() {
    loadProblem(probIdx);
  }

  // ── INIT ──
  buildTabs();
  loadProblem(0);
  </script>
